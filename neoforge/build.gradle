plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures: inside the RunConfigSettings
// delegate, `data()` shadows other resolutions, so these are hoisted here.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath
// Whether Farmer's Delight loads at dev runtime + datagen (see gradle.properties).
// Defined here (before the loom { runs { data } } block) so the datagen
// `--existing-mod farmersdelight` arg can be gated on it too.
def loadFD = (project.findProperty('loadFD') ?: rootProject.loadFD).toString().toBoolean()

// The side-by-side comparison mod (The Lead Age) is useless — and per the sibling
// project can hang/crash — in the headless game-test and data-generation runs, so
// it is only loaded for runClient/runServer.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def runningDataGen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('data') }

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    runs {
        // NeoForge data generation. Ported from the pre-Architectury single-loader
        // `runs.data` block. Output + existing-resource paths now point at the
        // relocated common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        data {
            data()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
            // FD's existing resources are only available when FD is on the run
            // classpath (loadFD); requesting them otherwise fails datagen.
            if (loadFD) programArgs('--existing-mod', 'farmersdelight')
        }

        // Give the dev server its own working directory so its COMMON config
        // (config/thesilverage-common.toml) is SEPARATE from the client's. Without
        // this, runClient and runServer share run/config/, making it impossible to
        // set different override_vanilla_recipes values — the mismatch the
        // join-sync packet resolves. Mirrors the Fabric :fabric runDir split.
        // `server` is a Loom-default run config, so we only override its runDir.
        //   client config → neoforge/run/config/thesilverage-common.toml
        //   server config → neoforge/run/server/config/thesilverage-common.toml
        server {
            runDir "run/server"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Recipe viewer / Create toggles, ported verbatim from the pre-Architectury
// single-loader build so NeoForge keeps identical dev-runtime behaviour.
//   ./gradlew :neoforge:runClient -Precipe_viewer=jei|emi|both|none
//   ./gradlew :neoforge:runClient -Penable_create=false
def selectedRecipeViewer = (project.findProperty('recipe_viewer') ?: rootProject.recipe_viewer).toString().toLowerCase()
if (!['jei', 'emi', 'both', 'none'].contains(selectedRecipeViewer)) {
    throw new GradleException("Invalid recipe_viewer='${selectedRecipeViewer}'. Valid values: jei, emi, both, none")
}
def loadJei = selectedRecipeViewer == 'jei' || selectedRecipeViewer == 'both'
def loadEmi = selectedRecipeViewer == 'emi' || selectedRecipeViewer == 'both'
def loadCreate = (project.findProperty('enable_create') ?: rootProject.enable_create).toString().toBoolean()

// Which Enhanced Celestials is present at dev runtime (see gradle.properties). Both
// compat paths compile regardless; this only decides what is loaded to test against.
def enhancedCelestialsVersion = (project.findProperty('enhanced_celestials') ?: rootProject.enhanced_celestials).toString()
if (!['1', '2', 'none'].contains(enhancedCelestialsVersion)) {
    throw new GradleException("Invalid enhanced_celestials='${enhancedCelestialsVersion}'. Valid values: 1, 2, none")
}
def loadEnhancedCelestials = enhancedCelestialsVersion != 'none'
logger.lifecycle("[TheSilverAge] (neoforge) Recipe viewer: ${selectedRecipeViewer} (JEI=${loadJei}, EMI=${loadEmi}), Create: ${loadCreate}, FD: ${loadFD}, Enhanced Celestials: ${enhancedCelestialsVersion}")

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Optional integrations (compile against these; load at runtime only when toggled) ----

    // JEI (runtime-only, toggled by -Precipe_viewer=jei|both).
    if (loadJei) {
        modLocalRuntime("mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}")
    }

    // EMI: compileOnly always so compat/emi/ModEmiPlugin compiles; localRuntime
    // only when toggled in so the plugin class is never loaded when EMI is absent.
    modCompileOnly("dev.emi:emi-neoforge:${rootProject.emi_version}")
    if (loadEmi) {
        modLocalRuntime("dev.emi:emi-neoforge:${rootProject.emi_version}")
    }

    // AppleSkin / Jade — dev-runtime niceties (runtime-only).
    modLocalRuntime("squeek.appleskin:appleskin-neoforge:mc1.21-${rootProject.appleskin_version}")
    modLocalRuntime "curse.maven:jade-324717:7428884"

    // The Lead Age (sibling mod) from CurseForge, for side-by-side comparison —
    // the mirror of how The Lead Age pulls in The Silver Age. Skipped for the
    // headless datagen / game-test runs, where a full content mod is useless and,
    // per the sibling project's own note, can hang or crash the run.
    if (!runningGameTest && !runningDataGen) {
        modLocalRuntime "curse.maven:the-lead-age-1544260:${rootProject.the_lead_age_neoforge_file}"
    }

    // Enhanced Celestials (optional Moon Dial compat). Dev-runtime only, like Jade/JEI,
    // so the lunar-event tooltip can actually be exercised in game. Its own required
    // deps (CorgiLib + DataAnchor) have to come along or EC refuses to load, and both
    // versions of the mod want the same ones.
    if (loadEnhancedCelestials) {
        modLocalRuntime "maven.modrinth:corgilib:${rootProject.corgilib_neoforge_version}"
        modLocalRuntime "maven.modrinth:data-anchor:${rootProject.data_anchor_neoforge_version}"
    }
    if (enhancedCelestialsVersion == '1') {
        modLocalRuntime "maven.modrinth:enhanced-celestials:${rootProject.enhanced_celestials_neoforge_version}"
    }
    if (enhancedCelestialsVersion == '2') {
        // The Core is a library with no events of its own, so the Default Lunar
        // Events mod has to come with it or there is nothing to see.
        //
        // localRuntime, not modLocalRuntime: loom refuses to remap these jars
        // ("Namespace mismatch, expected mojang got named"). No remap is needed
        // anyway — NeoForge mods are already Mojmap — so they go on the runtime
        // classpath directly, where NeoForge's dev-time locator picks them up.
        localRuntime "${rootProject.enhanced_celestials_2_core_neoforge}"
        localRuntime "${rootProject.enhanced_celestials_2_events_neoforge}"
    }

    // Farmer's Delight (optional compat — the Silver Knife). compileOnly ALWAYS so
    // the FD KnifeItem subclass compiles; localRuntime only when -PloadFD (default
    // true) so FD is present for dev testing + datagen (--existing-mod farmersdelight).
    // The mod never hard-depends on FD (conditional class), so it is never shipped.
    modCompileOnly "maven.modrinth:farmers-delight:${rootProject.farmersdelight_neoforge_version}"
    if (loadFD) {
        modLocalRuntime "maven.modrinth:farmers-delight:${rootProject.farmersdelight_neoforge_version}"
    }

    // Create — compileOnly always (so the datagen compat classes compile),
    // localRuntime only when toggled on (so the classes are never loaded when Create is absent).
    modCompileOnly("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_version}:slim") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${rootProject.registrate_version}")
    if (loadCreate) {
        modLocalRuntime("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_version}:slim") { transitive = false }
        modLocalRuntime("net.createmod.ponder:ponder-neoforge:${rootProject.ponder_version}+mc${rootProject.minecraft_version}")
        modLocalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${rootProject.flywheel_version}")
        modLocalRuntime("com.tterrag.registrate:Registrate:${rootProject.registrate_version}")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }

    // Copy the built-in resource pack from common into the NeoForge mod's
    // resource output so RecipeOverridePackHandler's
    // ModFile.findResource("resourcepacks/silver_recipe_overrides") resolves in
    // dev. As on Fabric, common's resources are on the dev classpath but are NOT
    // part of this mod file's resource roots, so without this copy
    // Pack.readMetaAndCreate finds no pack.mcmeta, returns null, and the handler
    // would feed a null pack into the repository (startup NPE). Production is
    // unaffected: shadowCommon already merges common into the NeoForge jar root.
    from(project(':common').file('src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    // NOTE (Phase 0): the common access widener is currently empty and the NeoForge
    // subproject ships an (intentionally empty) placeholder accesstransformer.cfg to
    // preserve the AT concept. Converting the AW into an AT here
    // (`atAccessWideners.add 'thesilverage.accesswidener'`) conflicts with that
    // placeholder ("jar already contains an access transformer"), so AW->AT
    // conversion is deferred until real entries exist in a later phase.
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
