plugins {
    // Maintained Shadow fork (Gradle-9 compatible). With loom-no-remap (26.1) there is no
    // remapJar — shadowJar becomes the PRIMARY mod artifact (bundles :common into the jar).
    id 'com.gradleup.shadow' version '9.4.2'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures: inside the RunConfigSettings
// delegate, `data()` shadows other resolutions, so these are hoisted here.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

// Dedicated source set for the automated GameTests. Its classes + datapack resources
// (test_instance JSON, the arena structure NBT) live here, NOT in `main`, so NONE of it
// ships in the production jar or sits on the runClient/runServer classpath — it is wired
// onto the `gameTest` run ONLY (see loom.runs.gameTest below). It compiles against main's
// full classpath (Minecraft, NeoForge, common) plus main's output.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

configurations {
    // Let the gametest source set resolve the same (loom-remapped) dependencies as main.
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
    gametestCompileOnly.extendsFrom compileOnly
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    runs {
        // NeoForge data generation. Ported from the pre-Architectury single-loader
        // `runs.data` block. Output + existing-resource paths now point at the
        // relocated common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        // NeoForge 21.4 split the old single `data` run template into `clientData`
        // + `serverData` (loom 1.10's data() maps to the now-removed `data` template
        // → "Could not find Forge run template" error). We use clientData(): its
        // environment is a superset (full client) so a single run with --all emits
        // BOTH the client model/asset providers and the server data providers.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
            // NOTE: no `--existing-mod farmersdelight` — FD is not yet published
            // past MC 1.21.1, so it is absent from the datagen classpath on this
            // branch. The FD-gated Silver Knife recipe is still emitted (gated via
            // ModLoadedCondition, written to disk regardless of FD's presence).
        }

        // Give the dev server its own working directory so its COMMON config
        // (config/thesilverage-common.toml) is SEPARATE from the client's. Without
        // this, runClient and runServer share run/config/, making it impossible to
        // set different override_vanilla_recipes values — the mismatch the
        // join-sync packet resolves. Mirrors the Fabric :fabric runDir split.
        // `server` is a Loom-default run config, so we only override its runDir.
        //   client config → neoforge/run/config/thesilverage-common.toml
        //   server config → neoforge/run/server/config/thesilverage-common.toml
        server {
            runDir "run/server"
        }

        // Automated GameTest server: launches a headless dedicated server, runs every
        // test_instance in the `thesilverage` namespace, and exits with a code equal to the
        // number of required failures (0 = all green). Task: ./gradlew :neoforge:runGameTest
        //
        // architectury-loom has no gameTestServer() helper (only client/server/data variants),
        // so we bind NeoForge's `gameTestServer` userdev launch template directly via the
        // public forgeTemplate(...) — the same mechanism server()/clientData() use internally.
        // That template flips on `neoforge.enableGameTest` and selects the gametest main flow;
        // we add the enabled-namespaces filter so ONLY this mod's tests run.
        gameTest {
            // environment string MUST equal the forge template name — loom derives the
            // launchTarget from `environment` (every built-in helper sets the two to the
            // same value, e.g. server() => environment "server" + forgeTemplate "server").
            environment "gameTestServer"
            forgeTemplate "gameTestServer"
            name = "Game Test"
            // The gametest source set (its runtimeClasspath already includes main's output),
            // so the test classes + datapack resources are present for THIS run only.
            source sourceSets.gametest
            // Declare BOTH source sets as the `thesilverage` mod *for this run only*, so
            // NeoForge treats the gametest output as mod content: it scans TheSilverAgeGameTests'
            // @EventBusSubscriber (→ registers the TEST_FUNCTION entries) and loads the
            // test_instance / structure datapack resources. Scoped to this run, so the normal
            // runClient/runServer/jar are untouched.
            mods {
                "${rootProject.mod_id}" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.gametest
                }
            }
            // --tests: select ONLY this mod's tests (a ResourceSelectorArgument glob, like the
            //   /test command). Without it the server runs every registered test_instance — our
            //   4 plus any built-in ones — so a future built-in test couldn't break this run.
            // --report: write a JUnit-like XML breakdown (relative to the run cwd =
            //   run/gametest) for CI to upload on failure. On GitHub Actions the server ALSO
            //   prints ::error:: annotations natively, so failures show inline too.
            programArgs '--tests', "${rootProject.mod_id}:*", '--report', 'gametest-report.xml'
            runDir "run/gametest"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// NOTE (1.21.6 branch): NO recipe viewer is available — JEI has no 1.21.6 build and EMI
// is stalled at MC 1.21.1 (see gradle.properties PORT NOTES). Both deferred; the EMI
// integration (ModEmiPlugin) + the -Precipe_viewer toggle live on the version/1.21 branch
// and return when a 1.21.6 viewer ships. Create also stays unavailable.

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // 26.1/loom-no-remap: plain configs (no `mod` prefix — nothing is remapped).
    // Architectury API (NeoForge).
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    // `namedElements` no longer exists under loom-no-remap — reference :common directly.
    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----

    // Jade — dev-runtime nicety (runtime-only). loom-no-remap: modLocalRuntime -> localRuntime.
    localRuntime("maven.modrinth:jade:${rootProject.jade_neoforge_version}")
    // Recipe viewer (JEI/EMI) — NONE for 1.21.6 yet; dependency intentionally omitted.
    // Re-add `modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:<ver>")` and/or
    // the EMI dep + ModEmiPlugin when a 1.21.6 build ships. See gradle.properties.

    // NOTE (1.21.4 branch): AppleSkin is dropped (no 1.21.4 build). Create + Farmer's
    // Delight are still unpublished for 1.21.4 — the Silver Knife compiles against the
    // local compile-only FD KnifeItem stub (src/main/java/vectorwing/farmersdelight/
    // common/item/KnifeItem.java), excluded from the shipped jar via
    // shadowJar { exclude 'vectorwing/**' }. Re-add those deps once they ship.
    // See gradle.properties PORT NOTES.
}

processResources {
    // Single-sourced manifest values (version, URLs, dependency ranges) derived from
    // gradle.properties — see rootProject.ext.manifestProps in the root build.gradle.
    def manifest = rootProject.ext.manifestProps()
    inputs.properties(manifest)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(manifest)
    }

    // Copy the built-in resource pack from common into the NeoForge mod's
    // resource output so RecipeOverridePackHandler's
    // ModFile.findResource("resourcepacks/silver_recipe_overrides") resolves in
    // dev. As on Fabric, common's resources are on the dev classpath but are NOT
    // part of this mod file's resource roots, so without this copy
    // Pack.readMetaAndCreate finds no pack.mcmeta, returns null, and the handler
    // would feed a null pack into the repository (startup NPE). Production is
    // unaffected: shadowCommon already merges common into the NeoForge jar root.
    from(project(':common').file('src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }
}

// 26.1/loom-no-remap: no remapJar. The default `jar` is loom-processed; we mark it `raw` and
// build shadowJar on top of its output so :common is merged in. shadowJar = primary mod jar.
//
// Access transformer: this subproject ships a HAND-MAINTAINED META-INF/accesstransformer.cfg
// that mirrors every entry in common's thesilverage.accesswidener (the AW does not auto-convert
// to an AT anymore — there is no remapJar to run atAccessWideners). NeoForge reads the AT from
// the jar's META-INF and applies it at load. It is in neoforge main resources, so it ships in
// the jar normally (and is preserved through the jar -> shadowJar pipeline).
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    // Drop the compile-only Farmer's Delight KnifeItem stub from the shipped jar (compile-time
    // only; the real FD class binds at runtime). Mirrors the Fabric FDR stub exclusion.
    exclude 'vectorwing/**'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Redirect the java component's outgoing artifacts to shadowJar (the shippable jar), so
// `from components.java` doesn't publish the classifier='raw' jar. Scaffolding (no maven
// repositories configured) but must resolve at configuration time.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// ---- Modrinth + CurseForge release (NeoForge jar) --------------------------------
// Run:  ./gradlew :neoforge:publishMods          (needs MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars)
//       ./gradlew :neoforge:publishMods -PpublishDryRun   (dry run — writes to build/, uploads nothing)
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = shadowJar.archiveFile
    // Same scheme as Fabric: version "1.3.1" / title "The Silver Age 1.3.1", distinguished
    // by the game-version + loader tags.
    version = rootProject.mod_version
    displayName = "The Silver Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        // Token: env var MODRINTH_TOKEN (CI/GitHub secret) OR a `modrinth_token` gradle
        // property — put that in your USER ~/.gradle/gradle.properties (never the repo).
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag EVERY supported game version (1.21.7 + 1.21.8) on the upload, not just the
        // build target — one jar, listed under both MC versions. See gradle.properties.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // NeoForge only needs Architectury — fabric-api / cloth-config are Fabric-only.
        requires("architectury-api")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        // Tag EVERY supported game version (1.21.7 + 1.21.8) on the upload, not just the
        // build target — one jar, listed under both MC versions. See gradle.properties.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
    }
}
