plugins {
    // loom-no-remap has no remapJar, so shadowJar is the primary mod artifact (bundles :common).
    id 'com.gradleup.shadow' version '9.4.2'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Hoisted out of the loom runs closures (inside the delegate, `data()` shadows these).
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath
// What only the Fabric jar carries: the Create Fly recipes (datagen/CreateFlyRecipeProvider).
def datagenFabricOutput = rootProject.file('fabric/src/generated/resources/').absolutePath

// The dev niceties are useless in the headless game-test run, and some crash it.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def runningDataGen = gradle.startParameter.taskNames.any { it.toLowerCase().endsWith('rundata') }

// Which optional mods the dev runs load, one switch each (gradle.properties):
//   ./gradlew :neoforge:runClient -Penable_grappling_hooks=false
def enabled = { String name -> (project.findProperty(name) ?: rootProject.property(name)).toString().toBoolean() }
def loadJei = enabled('enable_jei')
def loadJade = enabled('enable_jade')
def loadHooks = enabled('enable_grappling_hooks')

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Include the test-only source set in the dev mod so the game tests and their data load.
    // Dev-runtime only: the production jar is still built from `main`, so test classes never ship.
    // Added to Loom's own `main` group rather than a second group: two groups carrying the same
    // mod make the loader keep one, and some FML releases keep the one without the tests (none run).
    mods {
        named('main') {
            sourceSet sourceSets.test
        }
    }

    runs {
        // Data generation: ./gradlew :neoforge:runData. clientData()'s environment is a
        // superset, so one --all run emits both client and server data providers.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
            property('thesilverage.datagen.fabricOutput', datagenFabricOutput)
            // The mod without the test source set, which carries the datagen output into dev runs: datagen would
            // otherwise load the output of the run before as the mod's own while it writes the new one.
            mods {
                register('main') {
                    sourceSet sourceSets.main
                }
            }
        }

        // Give the dev server its own runDir so its config is separate from the client's
        // (lets client/server hold different override_vanilla_recipes values).
        server {
            runDir "run/server"
        }

        // Headless NeoForge game-test server: runs every test in GameTests, prints PASS/FAIL, and exits.
        //   ./gradlew :neoforge:runGameTest
        // The run takes NeoForge's gameTestServer template, which both enables and runs the tests; the environment
        // selects launch.cfg's section, so it names the template too.
        gameTest {
            environment 'gameTestServer'
            forgeTemplate 'gameTestServer'
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            // Only this mod's tests, so a built-in one can't break the run.
            programArgs '--tests', "${rootProject.mod_id}:*"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Test-only source set for game tests. Kept out of `main` so neither the test classes nor the arena
// structure ship in the production jar. The tests themselves are common/src/gametest; only the
// registration is NeoForge's own.
//
// The datagen output is in it too, for dev runs only. There common's transformed jar is a mod of its own
// (generated_<hash>) that nothing orders, so NeoForge's own Lodestone and Glistering Melon Slice recipes beat the
// overrides. As part of this mod it loads after NeoForge, as the shipped jar's does.
sourceSets {
    test {
        java.srcDir project(':common').file('src/gametest/java')
        resources.srcDir project(':common').file('src/gametest/resources')
        resources.srcDir project(':common').file('src/generated/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// The JUnit `test` task finds no tests in the game tests' source set, and Gradle 9 fails a test task that discovers none.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

processTestResources {
    exclude '.cache/**'
}

// Every run but datagen's loads the test source set as part of the mod, but only the game-test run builds it: the
// client and server would load whatever the last game tests copied.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).matching { it.name != 'runData' }.configureEach {
    dependsOn tasks.named('processTestResources')
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // loom-no-remap: plain configs (no `mod` prefix — nothing is remapped).
    api "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // Jade + JEI — dev-runtime only (never compiled against, never shipped). Never on the game-test run: they send
    // their packets to a test's mock player, whose connection has none of them, and crash the server.
    if (loadJade && !runningGameTest) {
        localRuntime("maven.modrinth:jade:${rootProject.jade_neoforge_version}")
    }
    if (loadJei && !runningGameTest) {
        localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-neoforge:${rootProject.jei_version}")
    }

    // Yori3o's Grappling Hooks, which reads the Silver Grappling Hook from yo_hooks/hooks.json, and YACL, which it
    // needs. Never compiled against: the hook is data alone.
    if (loadHooks && !runningGameTest && !runningDataGen) {
        localRuntime("maven.modrinth:yori3os-grappling-hooks:${rootProject.grappling_hooks_neoforge_version}")
        localRuntime("maven.modrinth:yacl:${rootProject.yacl_neoforge_version}")
    }
}

processResources {
    def manifest = rootProject.ext.manifestProps()
    inputs.properties(manifest)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(manifest)
    }

    // Copy common's built-in resource pack into the NeoForge resource output so it resolves in dev
    // (common is on the classpath but not a mod-file resource root; shadowCommon handles production).
    from(project(':common').file('src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }
}

// shadowJar is built on top of the Loom-processed `jar` (marked `raw`) so :common is merged in;
// shadowJar is the primary jar. The hand-maintained META-INF/accesstransformer.cfg (mirrors
// common's AW, since there's no remapJar to auto-convert) ships via main resources.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    // Drop the compile-only Farmer's Delight KnifeItem stub (real FD class binds at runtime).
    exclude 'vectorwing/**'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Redirect the java component's outgoing artifacts to shadowJar (the shippable jar) so
// `from components.java` doesn't publish the classifier='raw' jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// Publishing (NeoForge jar). ./gradlew :neoforge:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = shadowJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Silver Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // NeoForge only needs Architectury — fabric-api / cloth-config are Fabric-only.
        requires("architectury-api")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
    }
}
