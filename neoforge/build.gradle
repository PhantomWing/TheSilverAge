plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures: inside the RunConfigSettings
// delegate, `data()` shadows other resolutions, so these are hoisted here.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    runs {
        // NeoForge data generation. Ported from the pre-Architectury single-loader
        // `runs.data` block. Output + existing-resource paths now point at the
        // relocated common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        // NeoForge 21.4 split the old single `data` run template into `clientData`
        // + `serverData` (loom 1.10's data() maps to the now-removed `data` template
        // → "Could not find Forge run template" error). We use clientData(): its
        // environment is a superset (full client) so a single run with --all emits
        // BOTH the client model/asset providers and the server data providers.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
            // NOTE: no `--existing-mod farmersdelight` — FD is not yet published
            // past MC 1.21.1, so it is absent from the datagen classpath on this
            // branch. The FD-gated Silver Knife recipe is still emitted (gated via
            // ModLoadedCondition, written to disk regardless of FD's presence).
        }

        // Give the dev server its own working directory so its COMMON config
        // (config/thesilverage-common.toml) is SEPARATE from the client's. Without
        // this, runClient and runServer share run/config/, making it impossible to
        // set different override_vanilla_recipes values — the mismatch the
        // join-sync packet resolves. Mirrors the Fabric :fabric runDir split.
        // `server` is a Loom-default run config, so we only override its runDir.
        //   client config → neoforge/run/config/thesilverage-common.toml
        //   server config → neoforge/run/server/config/thesilverage-common.toml
        server {
            runDir "run/server"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// NOTE (1.21.6 branch): NO recipe viewer is available — JEI has no 1.21.6 build and EMI
// is stalled at MC 1.21.1 (see gradle.properties PORT NOTES). Both deferred; the EMI
// integration (ModEmiPlugin) + the -Precipe_viewer toggle live on the version/1.21 branch
// and return when a 1.21.6 viewer ships. Create also stays unavailable.

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). ----

    // Jade — dev-runtime nicety (runtime-only).
    modLocalRuntime("maven.modrinth:jade:${rootProject.jade_neoforge_version}")
    // Recipe viewer (JEI/EMI) — NONE for 1.21.6 yet; dependency intentionally omitted.
    // Re-add `modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:<ver>")` and/or
    // the EMI dep + ModEmiPlugin when a 1.21.6 build ships. See gradle.properties.

    // NOTE (1.21.4 branch): AppleSkin is dropped (no 1.21.4 build). Create + Farmer's
    // Delight are still unpublished for 1.21.4 — the Silver Knife compiles against the
    // local compile-only FD KnifeItem stub (src/main/java/vectorwing/farmersdelight/
    // common/item/KnifeItem.java), excluded from the shipped jar via
    // shadowJar { exclude 'vectorwing/**' }. Re-add those deps once they ship.
    // See gradle.properties PORT NOTES.
}

processResources {
    // Single-sourced manifest values (version, URLs, dependency ranges) derived from
    // gradle.properties — see rootProject.ext.manifestProps in the root build.gradle.
    def manifest = rootProject.ext.manifestProps()
    inputs.properties(manifest)

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(manifest)
    }

    // Copy the built-in resource pack from common into the NeoForge mod's
    // resource output so RecipeOverridePackHandler's
    // ModFile.findResource("resourcepacks/silver_recipe_overrides") resolves in
    // dev. As on Fabric, common's resources are on the dev classpath but are NOT
    // part of this mod file's resource roots, so without this copy
    // Pack.readMetaAndCreate finds no pack.mcmeta, returns null, and the handler
    // would feed a null pack into the repository (startup NPE). Production is
    // unaffected: shadowCommon already merges common into the NeoForge jar root.
    from(project(':common').file('src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    // Drop the compile-only Farmer's Delight KnifeItem stub from the shipped jar.
    // The stub (src/main/java/vectorwing/farmersdelight/common/item/KnifeItem)
    // exists ONLY so SilverKnifeItem can `extend` FD's KnifeItem at compile time
    // (no FD jar is available past MC 1.21.1). It must NOT ship: once FD ships for
    // 1.21.3 the real class (same FQN) is what SilverKnifeItem binds to, and a
    // shipped stub would shadow/conflict with it. Mirrors the Fabric FDR stub.
    exclude 'vectorwing/**'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    // NOTE (Phase 0): the common access widener is currently empty and the NeoForge
    // subproject ships an (intentionally empty) placeholder accesstransformer.cfg to
    // preserve the AT concept. Converting the AW into an AT here
    // (`atAccessWideners.add 'thesilverage.accesswidener'`) conflicts with that
    // placeholder ("jar already contains an access transformer"), so AW->AT
    // conversion is deferred until real entries exist in a later phase.
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// ---- Modrinth + CurseForge release (NeoForge jar) --------------------------------
// Run:  ./gradlew :neoforge:publishMods          (needs MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars)
//       ./gradlew :neoforge:publishMods -PpublishDryRun   (dry run — writes to build/, uploads nothing)
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = remapJar.archiveFile
    // Same scheme as Fabric: version "1.3.1" / title "The Silver Age 1.3.1", distinguished
    // by the game-version + loader tags.
    version = rootProject.mod_version
    displayName = "The Silver Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        // Token: env var MODRINTH_TOKEN (CI/GitHub secret) OR a `modrinth_token` gradle
        // property — put that in your USER ~/.gradle/gradle.properties (never the repo).
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        minecraftVersions.add(rootProject.minecraft_version)
        // NeoForge only needs Architectury — fabric-api / cloth-config are Fabric-only.
        requires("architectury-api")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        minecraftVersions.add(rootProject.minecraft_version)
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
    }
}
