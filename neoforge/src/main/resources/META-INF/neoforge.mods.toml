modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/PhantomWing/TheSilverAge/issues"
license = "MIT License"

[[mods]]
modId = "thesilverage"
version = "${version}"
displayName = "The Silver Age"
displayURL = "https://github.com/PhantomWing/TheSilverAge"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
'''

# Client-only mixin that hides the mod-managed recipe-override resource pack
# from Options → Resource Packs (the pack stays in the repository and is toggled
# by config / server-sync; it just isn't a user-facing entry).
[[mixins]]
config = "thesilverage.neoforge.mixins.json"

[[dependencies.thesilverage]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.218,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thesilverage]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thesilverage]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

# Optional: when Enhanced Celestials is present the Moon Dial names the active
# lunar event (Blood Moon, ...) instead of the vanilla phase.
[[dependencies.thesilverage]]
modId = "enhancedcelestials"
type = "optional"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"
