modLoader = "javafml"
loaderVersion = "${dep_loader_neoforge}"
issueTrackerURL = "${mod_issues}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage}"
authors = "${mod_author}"
description = '''
${mod_description}
'''

# Client-only mixin that hides the mod-managed recipe-override resource packs
# from Options → Resource Packs (the packs stay in the repository and are toggled
# by config / server-sync; they just aren't user-facing entries).
[[mixins]]
config = "thesilverage.neoforge.mixins.json"

# AFTER, so the Lodestone and Glistering Melon Slice overrides outrank NeoForge's own
# copies of those recipes. Without an ordering, FML orders mods' data by a hash of
# their ids, and NeoForge's won wherever fewer than about 25 mods were installed.
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${dep_neoforge}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${dep_minecraft_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "architectury"
type = "required"
versionRange = "${dep_architectury_neoforge}"
ordering = "AFTER"
side = "BOTH"

# Optional: after Backported Spears, so the Silver Spear goes in the Combat tab after its Golden Spear, which it adds
# in the same creative tab event (VanillaTabs).
# Backported Spears from 1.0.5, the version the Silver Spear is built and checked against.
[[dependencies.${mod_id}]]
modId = "spears"
type = "optional"
versionRange = "[1.0.5,)"
ordering = "AFTER"
side = "BOTH"
