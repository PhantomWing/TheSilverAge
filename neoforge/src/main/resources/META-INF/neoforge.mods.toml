modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/PhantomWing/TheSilverAge/issues"
license = "MIT License"

[[mods]]
modId = "thesilverage"
version = "${version}"
displayName = "The Silver Age"
displayURL = "https://github.com/PhantomWing/TheSilverAge"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
'''

# Client-only mixin that hides the mod-managed recipe-override resource packs
# from Options → Resource Packs (the packs stay in the repository and are toggled
# by config / server-sync; they just aren't user-facing entries).
[[mixins]]
config = "thesilverage.neoforge.mixins.json"

# AFTER, so the Lodestone and Glistering Melon Slice overrides outrank NeoForge's own
# copies of those recipes. Without an ordering, FML orders mods' data by a hash of
# their ids, and NeoForge's won wherever fewer than about 25 mods were installed.
[[dependencies.thesilverage]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.218,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.thesilverage]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thesilverage]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

# Optional: when Enhanced Celestials is present the Moon Dial names the active
# lunar event (Blood Moon, ...) above the vanilla phase and tints its moon to match.
[[dependencies.thesilverage]]
modId = "enhancedcelestials"
type = "optional"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: Enhanced Celestials 2 is a separate mod rather than an update, so it is
# supported alongside the above. This is the library half — the events themselves
# come from enhancedcelestials2defaultlunarevents (or any other add-on), which we
# never touch directly, so it is deliberately not listed.
[[dependencies.thesilverage]]
modId = "enhancedcelestials2core"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
