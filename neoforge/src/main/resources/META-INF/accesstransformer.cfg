# Mirrors the common access widener entry for BlockSetType.register (used by
# ModBlockSetTypes). Kept as a manual AT entry rather than an arch-loom
# AW->AT conversion because the firework entries above already ship a manual
# accesstransformer.cfg in the jar (arch-loom's atAccessWideners would conflict).
public net.minecraft.world.level.block.state.properties.BlockSetType register(Lnet/minecraft/world/level/block/state/properties/BlockSetType;)Lnet/minecraft/world/level/block/state/properties/BlockSetType;
# Mirrors the common AW entry widening RangeSelectItemModelProperties.ID_MAPPER,
# used by the shared common client.ModItemProperties to register the custom
# thesilverage:moon_phase range-select property (1.21.4 replaced the old
# ItemProperties.register system). Without this, the AW applies in dev / Fabric
# production but NOT in NeoForge production, throwing IllegalAccessError at
# moon-phase property registration on a production NeoForge client.
public net.minecraft.client.renderer.item.properties.numeric.RangeSelectItemModelProperties ID_MAPPER
