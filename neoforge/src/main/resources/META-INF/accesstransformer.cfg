# The Silver Age — NeoForge access transformer.
# Exposes the static FireworkStarRecipe shape map so ModFireworks can append
# silver firework-star ingredients (see com.phantomwing.thesilverage.firework.ModFireworks).
# (1.21.2 removed the SHAPE_INGREDIENT field — matches() reads SHAPE_BY_ITEM directly.)
public-f net.minecraft.world.item.crafting.FireworkStarRecipe SHAPE_BY_ITEM
# Mirrors the common access widener entry widening the BlockEntityType ctor
# (1.21.2 removed BlockEntityType.Builder); used by shared ModBlockEntityTypes.
public net.minecraft.world.level.block.entity.BlockEntityType <init>(Lnet/minecraft/world/level/block/entity/BlockEntityType$BlockEntitySupplier;Ljava/util/Set;)V
# Mirrors the common access widener entry for BlockSetType.register (used by
# ModBlockSetTypes). Kept as a manual AT entry rather than an arch-loom
# AW->AT conversion because the firework entries above already ship a manual
# accesstransformer.cfg in the jar (arch-loom's atAccessWideners would conflict).
public net.minecraft.world.level.block.state.properties.BlockSetType register(Lnet/minecraft/world/level/block/state/properties/BlockSetType;)Lnet/minecraft/world/level/block/state/properties/BlockSetType;
# Mirrors the common access widener entry for ItemProperties.register, used by
# the shared common client.ModItemProperties (Moon Dial moon_phase override).
# Without this, the access widener applies in dev / Fabric production but NOT in
# NeoForge production (NeoForge uses ATs, not AWs), so the private method access
# throws IllegalAccessError on a production NeoForge client at item-property
# registration time.
public net.minecraft.client.renderer.item.ItemProperties register(Lnet/minecraft/world/item/Item;Lnet/minecraft/resources/ResourceLocation;Lnet/minecraft/client/renderer/item/ClampedItemPropertyFunction;)V
