architectury {
    common(rootProject.enabled_platforms.split(','))
}

loom {
    accessWidenerPath = file('src/main/resources/thesilverage.accesswidener')
}

// Datagen output is committed and shared across loaders. The Forge data
// generator (see :forge) writes to src/generated/resources; wire that as an
// additional resource source directory so the generated assets/data ship in the
// common jar (and therefore in every loader's mod jar).
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

processResources {
    // The data generator's hash cache is not a runtime resource.
    exclude '.cache/**'
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations and
    // get the mixin dependencies. Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Architectury API (common).
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // JEI plugin API and EMI's xplat artifact, compile-time only, for the info pages' plugins in common: each is only
    // ever classloaded by its viewer, so neither is required or shipped.
    modCompileOnly "mezz.jei:jei-1.20.1-common-api:${rootProject.jei_version}"
    modCompileOnly "dev.emi:emi-xplat-intermediary:${rootProject.emi_version}"

    // Enhanced Celestials (optional Moon Dial compat), compiled against only: its API classes are the same on both
    // loaders, so common compiles against the intermediary-mapped Fabric jar and neither jar is ever shipped.
    modCompileOnly "maven.modrinth:enhanced-celestials:${rootProject.enhanced_celestials_fabric_version}"
    modCompileOnly "maven.modrinth:data-anchor:${rootProject.data_anchor_fabric_version}"

    // Enhanced Celestials 2, a different mod, dispatched between at runtime (compat/LunarEvents). Plain compileOnly
    // of the Forge jar: its Fabric jar was built with a newer Loom (1.16.3), which this one refuses to remap. Only its
    // own classes' signatures are read, and Forge 1.20.1 keeps Mojang's class names, so nothing needs remapping.
    compileOnly "maven.modrinth:enhanced-celestials-2-core:${rootProject.enhanced_celestials_2_core_forge}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "${rootProject.mod_id}-common"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
