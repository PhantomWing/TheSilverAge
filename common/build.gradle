architectury {
    common(rootProject.enabled_platforms.split(','))
}

loom {
    accessWidenerPath = file('src/main/resources/thesilverage.accesswidener')
}

// Datagen output is committed and shared across loaders. The NeoForge data
// generator (see :neoforge) writes to src/generated/resources; wire that as an
// additional resource source directory so the generated assets/data ship in the
// common jar (and therefore in every loader's mod jar).
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

processResources {
    // The data generator's hash cache is not a runtime resource.
    exclude '.cache/**'
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations and
    // get the mixin dependencies. Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Architectury API (common).
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // Enhanced Celestials (optional Moon Dial compat). compileOnly: the API classes are
    // identical on both loaders (EC is Architectury-based), so common compiles against
    // the intermediary-mapped Fabric jar and neither jar is ever shipped.
    modCompileOnly "maven.modrinth:enhanced-celestials:${rootProject.enhanced_celestials_common_version}"
    modCompileOnly "maven.modrinth:data-anchor:${rootProject.data_anchor_common_version}"

    // Enhanced Celestials 2 — a different mod, not an upgrade, so it is compiled
    // against alongside EC1 and dispatched between at runtime (see compat/LunarEvents).
    //
    // Plain compileOnly, NOT modCompileOnly, and the NeoForge build rather than the
    // Fabric one. EC2's Fabric jar declares `Fabric-Loom-Mixin-Remap-Type: static`,
    // and loom only runs its "built with a newer version of Loom" check on static
    // jars (ArtifactMetadata: the check is skipped entirely for the classic `mixin`
    // type) — which is why EC1's Fabric jar passes despite ALSO being newer than ours
    // (Loom 1.10.453 vs 1.7.435), while EC2's 1.16.3 is refused. Same reason CorgiLib
    // Fabric and FD Refabricated are unusable here; all three are static.
    //
    // The NeoForge jar sidesteps it: not Loom-produced, and already Mojmap, so it
    // lines up with our named mappings with no remap step. Only signatures are needed
    // here and nothing is shipped, and the Fabric jar exposes identical class names,
    // so the shipped Fabric build binds to the real classes fine.
    //
    // The alternative is -Ploom.ignoreDependencyLoomVersionValidation=true, which
    // would allow the Fabric jar via modCompileOnly, but it disables the check for
    // EVERY dependency including runtime ones, so it is not worth it for signatures.
    compileOnly "${rootProject.enhanced_celestials_2_core_neoforge}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = "${rootProject.mod_id}-common"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
