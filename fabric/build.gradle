plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Silver loot parity mixin (Fabric equivalent of the NeoForge GLMs). The
    // refmap name must match "refmap" in thesilverage.mixins.json so the mixin
    // annotation processor remaps the named targets at build time.
    mixin {
        defaultRefmapName = 'thesilverage.refmap.json'
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

// Recipe-viewer toggle, mirroring the NeoForge subproject so Fabric honours the
// same `-Precipe_viewer=jei|emi|both|none` / project property. EMI is the
// cross-loader default (the project already has a NeoForge EMI plugin); JEI
// Fabric is offered for parity with the NeoForge toggle.
//   ./gradlew :fabric:runClient -Precipe_viewer=emi|jei|both|none
def selectedRecipeViewer = (project.findProperty('recipe_viewer') ?: rootProject.recipe_viewer).toString().toLowerCase()
if (!['jei', 'emi', 'both', 'none'].contains(selectedRecipeViewer)) {
    throw new GradleException("Invalid recipe_viewer='${selectedRecipeViewer}'. Valid values: jei, emi, both, none")
}
def loadJei = selectedRecipeViewer == 'jei' || selectedRecipeViewer == 'both'
def loadEmi = selectedRecipeViewer == 'emi' || selectedRecipeViewer == 'both'
logger.lifecycle("[TheSilverAge] (fabric) Recipe viewer: ${selectedRecipeViewer} (JEI=${loadJei}, EMI=${loadEmi})")

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Architectury API (Fabric).
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency; mirrors the NeoForge intent). ----

    // Recipe viewer. EMI (dev.emi:emi-fabric) is the cross-loader choice and
    // reuses the same `emi_version` property as the NeoForge `emi-neoforge`
    // dep. NOTE: unlike NeoForge there is NO Fabric-side `modCompileOnly` for
    // EMI — NeoForge needs it so `compat/emi/ModEmiPlugin` compiles, but no
    // Fabric EMI plugin source exists (and none is needed: Fabric API's
    // OxidizableBlocksRegistry writes the vanilla HoneycombItem.WAXABLES /
    // WeatheringCopper.NEXT_BY_BLOCK BiMaps that EMI's built-in VanillaPlugin
    // already iterates, so silver weathering/waxing recipes show automatically
    // on Fabric — see report). So a compileOnly here would have no consumer.
    if (loadJei) {
        modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${rootProject.jei_version}")
    }
    if (loadEmi) {
        modLocalRuntime("dev.emi:emi-fabric:${rootProject.emi_version}")
    }

    // AppleSkin (Fabric). The `appleskin_version=3.0.7` property cannot be
    // reused: the Fabric build of AppleSkin for the MC 1.21 line tops out at
    // mc1.21-3.0.6 (3.0.7 Fabric only ships for mc1.21.9+, not 1.21.1), whereas
    // the NeoForge build does have mc1.21-3.0.7. mc1.21-3.0.6 is the newest
    // Fabric AppleSkin compatible with MC 1.21.1; the minor delta is immaterial
    // for a dev-only food/saturation HUD overlay.
    modLocalRuntime("squeek.appleskin:appleskin-fabric:mc1.21-3.0.6")

    // Cloth Config — a real (compiled + shipped) Fabric dependency: it backs the
    // Fabric AutoConfig config (TheSilverAgeFabricConfig), mirroring how
    // RusticDelight-Fabric does its config. Being a first-class modImplementation
    // (runtime classpath, JiJ'd at build) it ALSO satisfies AppleSkin's bundled
    // Cloth Config need in dev, so the prior dev-only modLocalRuntime workaround
    // is no longer required. fabric-api excluded to avoid a transitive downgrade.
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Jade (Fabric): intentionally NOT added. The NeoForge side pins a specific
    // CurseForge file id (curse.maven:jade-324717:7428884); no Fabric 1.21.1
    // Jade file id was confirmed available on an already-declared repo at the
    // time of writing, and the spec marks Jade optional/nice-to-have. Add a
    // verified `curse.maven:jade-324717:<fabric-1.21.1-file-id>` here if/when
    // one is confirmed. (TODO: optional Jade Fabric dev dep — fabric/build.gradle)
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
