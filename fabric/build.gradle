plugins {
    // loom-no-remap has no remapJar, so shadowJar is the primary mod artifact (bundles :common).
    id 'com.gradleup.shadow' version '9.4.2'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// The dev niceties below can only get in the way of the headless game-test server, which tests this mod alone.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }

// Which optional mods the dev runs load, one switch each (gradle.properties).
//   ./gradlew :fabric:runClient -Penable_farmers_delight=false
def enabled = { String name -> (project.findProperty(name) ?: rootProject.property(name)).toString().toBoolean() }
def loadJei = enabled('enable_jei')
def loadFarmersDelight = enabled('enable_farmers_delight')
def loadHooks = enabled('enable_grappling_hooks')

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // The test source set is a mod of its own, thesilverage_gametest, whose fabric.mod.json names the
    // fabric-gametest entrypoint: an entrypoint in the shipped manifest would name a class the jar doesn't have.
    mods {
        register('thesilverage_gametest') {
            sourceSet sourceSets.test
        }
    }

    // Give the dev server its own runDir so its config is separate from the client's
    // (lets client/server hold different override_vanilla_recipes values).
    runs {
        server {
            runDir "run/server"
        }

        // Headless Fabric game-test server: runs the same tests as NeoForge's, prints PASS/FAIL, and exits.
        //   ./gradlew :fabric:runGameTest
        gameTest {
            server()
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            vmArg '-Dfabric-api.gametest'
        }
    }
}

// Test-only source set for game tests, kept out of `main` so nothing in it ships. The tests are
// common/src/gametest, shared with NeoForge; only the registration is Fabric's own.
sourceSets {
    test {
        java.srcDir project(':common').file('src/gametest/java')
        resources.srcDir project(':common').file('src/gametest/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// The JUnit `test` task finds no tests in the game tests' source set, and Gradle 9 fails a test task that discovers none.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    // loom-no-remap: plain configs (no `mod` prefix — nothing is remapped).
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    api "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // JEI — recipe viewer, dev-runtime only; its info pages' plugin is in common (compat/jei). Not on the game-test
    // run, where it has nothing to show.
    if (loadJei && !runningGameTest) {
        localRuntime("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")
    }
    // Farmer's Delight Refabricated, for the Silver Knife: its KnifeItem, which SilverKnifeItem extends, and its
    // creative tab. Compiled against always; the knife is a plain item where it isn't installed.
    compileOnly("maven.modrinth:farmers-delight-refabricated:${rootProject.farmers_delight_fabric_version}") { transitive = false }
    if (loadFarmersDelight && !runningGameTest) {
        localRuntime("maven.modrinth:farmers-delight-refabricated:${rootProject.farmers_delight_fabric_version}")
    }
    // Yori3o's Grappling Hooks, for the Silver Grappling Hook (data only), and the YACL it needs.
    if (loadHooks && !runningGameTest) {
        localRuntime("maven.modrinth:yori3os-grappling-hooks:${rootProject.grappling_hooks_fabric_version}")
        localRuntime("maven.modrinth:yacl:${rootProject.yacl_fabric_version}")
    }

    // Cloth Config — compiled + shipped; backs the Fabric AutoConfig config. fabric-api excluded to avoid a transitive downgrade.
    implementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    // Mod Menu opens that config's screen from its mod list (TheSilverAgeModMenu); compiled against only.
    compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
}

processResources {
    def manifest = rootProject.ext.manifestProps()
    inputs.properties(manifest)

    filesMatching('fabric.mod.json') {
        expand(manifest)
    }

    // Copy common's built-in resource pack into the Fabric resource output so it resolves in dev
    // (common is on the classpath but not a mod-container root path; shadowJar handles production).
    from(project(':common').file('src/main/resources/resourcepacks')) {
        into 'resourcepacks'
    }

    // Same dev-only reason: Fabric Loader reads the access widener (declared in fabric.mod.json)
    // from the mod's resource root, which in dev is the Fabric source set — not common's.
    from(project(':common').file('src/main/resources/thesilverage.accesswidener'))
}

// shadowJar is built on top of the Loom-processed `jar` (marked `raw`) so Loom's JiJ
// fabric.mod.json is preserved while :common is merged in; shadowJar is the primary jar.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    // Build from the Loom-processed jar, not source, to keep Loom's fabric.mod.json.
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null
}

assemble.dependsOn shadowJar

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Redirect the java component's outgoing artifacts to shadowJar (the shippable jar) so
// `from components.java` doesn't publish the classifier='raw' jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}

// Publishing (Fabric jar). ./gradlew :fabric:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = shadowJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Silver Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("fabric")
    // -PpublishDryRun => stage to build/ without uploading.
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }
}
