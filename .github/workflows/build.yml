name: Build

# CI build check — compiles + assembles all loaders on every push to a version branch
# and on pull requests, so breakage is caught before release. Does NOT publish anything.

on:
  push:
    branches:
      - 'version/**'
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # See release.yml: the committed gradle.properties pins a local Windows JDK path
      # that doesn't exist on the runner — strip it so CI uses the runner's JDK 21.
      - name: Drop machine-specific JDK pin
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # Automated regression suite (data-driven GameTests). Runs a headless NeoForge
      # gametest server — no display needed for the neoforgegametestserverdev target — which
      # exits non-zero if any test fails, gating the job. Scoped to thesilverage:* by the run
      # config. The arena structure NBT is a committed resource, so no datagen step is needed.
      - name: Run GameTests (NeoForge)
        run: ./gradlew :neoforge:runGameTest --stacktrace

      # On a test failure, surface the per-test breakdown: the JUnit-like XML report plus the
      # full server logs. (Failures also appear inline via the server's native ::error::
      # GitHub annotations.)
      - name: Upload GameTest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            neoforge/run/gametest/gametest-report.xml
            neoforge/run/gametest/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
