name: Build

# CI build check — compiles + assembles all loaders on every push to a version branch
# and on pull requests, so breakage is caught before release. Does NOT publish anything.

on:
  push:
    branches:
      - 'version/**'
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # See release.yml: the committed gradle.properties pins a local Windows JDK path
      # that doesn't exist on the runner — strip it so CI uses the runner's JDK 21.
      - name: Drop machine-specific JDK pin
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
