## Mod info
mod_version=1.4.0
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21, though this line
# compiles for Java 17. The system default `java` may be another JDK, so the daemon JVM is
# pinned explicitly. Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Forge. The Forge jar also runs on NeoForge 1.20.1, a Forge-compatible fork, so its upload names both.
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)

# Architectury / multi-loader
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.435
architectury_version=9.2.14
enabled_platforms=fabric,forge

# Fabric
fabric_loader_version=0.16.10
fabric_api_version=0.92.2+1.20.1

# Other dependencies
appleskin_forge_version=mc1.20.1-2.5.1
appleskin_fabric_version=mc1.20.1-2.5.2
jei_version=15.20.0.130
emi_version=1.1.22+1.20.1
# Cloth Config (Fabric only), which backs the Fabric AutoConfig config. 11.1.x is the 1.20.1 line.
cloth_config_version=11.1.136
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install.
modmenu_version=7.2.2
# Create 6 for Forge 1.20.1, from the Create maven (its build number is part of the version there).
create_version=6.0.8-289
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
# Farmer's Delight (Forge), for the Silver Knife. Fabric compiles against a stub of its KnifeItem.
farmersdelight_forge_version=1.20.1-1.3.1

# Enhanced Celestials (optional Moon Dial compat), compileOnly only, never shipped. Common compiles against the
# Fabric (intermediary-mapped) jar; DataAnchor is on its compile classpath since the forecast extends one of its types.
enhanced_celestials_fabric_version=1.20.1-5.0.3.3-fabric
enhanced_celestials_forge_version=1.20.1-5.0.3.3-forge
data_anchor_fabric_version=1.0.0.24-fabric
data_anchor_forge_version=1.0.0.24-forge
corgilib_forge_version=1.20.1-4.0.3.6-forge
corgilib_fabric_version=1.20.1-4.0.3.6-fabric
# Enhanced Celestials 2, a separate mod with its own id (enhancedcelestials2core). Modrinth version ids.
enhanced_celestials_2_core_fabric=lRXoz8Kg
enhanced_celestials_2_core_forge=awjgJNBd
enhanced_celestials_2_events_forge=PGxD6JWg
# Which Enhanced Celestials is loaded at Forge dev runtime: 1, 2 or none. Both compat paths are always compiled.
#   ./gradlew :forge:runClient -Penhanced_celestials=2
# None by default: with Enhanced Celestials 1 (or its CorgiLib and Data Anchor) on the Forge dev classpath, Loom fails
# to set up Minecraft ("Failed to process jar when running jar processor: fabric-loom:access-widener"), so the Moon
# Dial's lunar events are untested in a dev run here.
enhanced_celestials=none

# Which optional mods the dev runs load, one switch each, to test with or without it. Each is compiled against
# either way. Override one at the command line: ./gradlew :forge:runClient -Penable_mekanism=false
#
# Farmer's Delight (Forge), for the Silver Knife, in the game runs and in datagen (`--existing-mod farmersdelight`).
enable_farmers_delight=true

# Which recipe viewer(s) to load at runtime. Valid values: jei, emi, both, none
# Override at the command line with: ./gradlew runClient -Precipe_viewer=emi
recipe_viewer=jei

# Create (Forge), for its machines on silver and the Silver Sheet.
enable_create=true
# Create: Aquatic Ambitions (Forge), for its channeling. Needs Create.
enable_create_aquatic_ambitions=true
# Vanilla Backport, for the Silver Spear and the Silver Nautilus Armor.
enable_vanilla_backport=true
# Yori3o's Grappling Hooks, for the Silver Grappling Hook (Forge).
enable_grappling_hooks=true
# Mekanism (Forge only), for silver's ore processing.
enable_mekanism=true

# Modrinth version ids of the mods above, each loader's own, all for 1.20.1.
vanilla_backport_forge_version=oWVWW4Xg
vanilla_backport_fabric_version=SgvHEKg5
platform_forge_version=28ghzOb2
platform_fabric_version=vghFfekW
grappling_hooks_forge_version=jZnX7Gux
# Create: Aquatic Ambitions 1.20.1-6.0.8-2.0.2.
create_aquatic_ambitions_version=jIvpBfZr
# Mekanism 10.4.16.80.
mekanism_version=uxe1WQp4

# Publishing (Modrinth + CurseForge via mod-publish-plugin). Project IDs are public; tokens
# come from MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars or modrinth_token / curseforge_token
# in ~/.gradle/gradle.properties.
mod_publish_plugin_version=2.0.0
modrinth_project_id=LEHsZZ4j
curseforge_project_id=1355287
# Every game version this one jar is listed under: the 1.20.1 rung covers 1.20.1 alone.
supported_minecraft_versions=1.20.1
