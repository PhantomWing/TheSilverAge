## Mod info
mod_version=1.4.1
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_author=PhantomWing
mod_homepage=https://github.com/PhantomWing/TheSilverAge

org.gradle.jvmargs=-Xmx3G
# 26.1 needs the Gradle daemon itself on JDK 25 (not just the toolchain); system default is JDK 17.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is incompatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=[26.1,26.1.3)
# Space-separated; drives the manifest range floor (first) + per-upload version tags (all).
supported_minecraft_versions=26.1 26.1.1 26.1.2
# The NeoForge upload is listed under this version alone: neo_version_range needs NeoForge 26.1.2,
# which exists for 26.1.2 only. The Fabric upload keeps the whole list above.
neoforge_minecraft_versions=26.1.2
neo_version=26.1.2.75
neo_version_range=[26.1.2,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.5.167
architectury_loom_version=1.17.477
architectury_version=20.0.5
enabled_platforms=fabric,neoforge

# Publishing (mod-publish-plugin); IDs public, tokens from MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars.
mod_publish_plugin_version=2.0.0
modrinth_project_id=LEHsZZ4j
curseforge_project_id=1355287

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.151.0+26.1.2
# Create Fly, the Fabric port of Create (mod id `create`), from the Modrinth maven: loaded in the Fabric dev runs.
# Built for 26.1.2, its manifest takes 26.1 to 26.1.2 and any Fabric Loader.
create_fly_version=26.1.2-6.0.9-4

# Dev-runtime deps
jade_neoforge_version=26.1.11+neoforge
cloth_config_version=26.1.154
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install. 18.0.2 is the 26.1.x build.
modmenu_version=18.0.2
# JEI: dev-runtime on both loaders, and its common API compiled against for the 1.4 info pages (compat/jei).
# Artifact id embeds ${minecraft_version}.
jei_version=29.6.2.31

# Which optional mods the dev runs load, one switch each, to test with or without it. Override one at the command
# line: ./gradlew :fabric:runClient -Penable_create_fly=false
#
# Create Fly (Fabric), for its machines on silver and the Silver Sheet.
enable_create_fly=true
# Yori3o's Grappling Hooks (both loaders, with YACL), for the Silver Grappling Hook.
enable_grappling_hooks=true

# Modrinth version ids of the mods above, each loader's own: Grappling Hooks 5.4.0 and YACL 3.9.7 for 26.1.
grappling_hooks_neoforge_version=HZeXttDX
grappling_hooks_fabric_version=vqPqfNue
yacl_neoforge_version=B1mfgQmD
yacl_fabric_version=IODousKT

# The 1.4 info pages (compat/SilverInfo) show in JEI through the common compat/jei plugin. EMI, Enhanced Celestials,
# NeoForge's Create and Create: Aquatic Ambitions have no 26.1 build (checked 2026-11-01), so the Moon Dial's lunar
# events, Create on NeoForge and Aquatic Ambitions' channeling are left out of this line: compat/LunarEvents answers as
# for an ordinary night. Fabric's Create Fly gets its recipes from CreateFlyRecipeProvider (see CLAUDE.md).
