# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)
parchment_version=2023.09.03

## Mod info
mod_version=1.2.0
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_authors=PhantomWing

# Other dependencies
appleskin_version=mc1.20.1-2.5.0
jei_version=15.19.0.85
emi_version=1.1.22+1.20.1

# Create mod (Forge 1.20.1, using Create 6.0.x via legacyforge plugin)
create_version=6.0.8
create_version_number=289
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3

# Which recipe viewer(s) to load at runtime. Valid values: jei, emi, both, none
# Override at the command line with: ./gradlew runClient -Precipe_viewer=emi
recipe_viewer=emi

# Whether to load Create at runtime. Toggle with -Penable_create=false
enable_create=true
