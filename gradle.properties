## Mod info
mod_version=1.4.1
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_author=PhantomWing
mod_homepage=https://github.com/PhantomWing/TheSilverAge

org.gradle.jvmargs=-Xmx3G
# 26.1 needs the Gradle daemon itself on JDK 25 (not just the toolchain); system default is JDK 17.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is incompatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.3
minecraft_version_range=[26.3,26.3.1)
# Space-separated; drives the manifest range floor (first) + per-upload version tags (all).
supported_minecraft_versions=26.3
neo_version=26.3.0.76
neo_version_range=[26.3.0.48,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.5.170
architectury_loom_version=1.17.493
architectury_version=22.0.5
enabled_platforms=fabric,neoforge

# Publishing (mod-publish-plugin); IDs public, tokens from MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars.
mod_publish_plugin_version=2.0.0
modrinth_project_id=LEHsZZ4j
curseforge_project_id=1355287

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# Dev-runtime deps
jade_neoforge_version=26.3.1+neoforge
cloth_config_version=26.3.158
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install. 21.0.0 is the 26.3 build,
# on the Terraformers maven.
modmenu_version=21.0.0
# JEI: dev-runtime on both loaders, and its common API compiled against for the 1.4 info pages (compat/jei).
# Artifact id embeds ${minecraft_version}.
jei_version=31.10.0.63

# Which optional mods the dev runs load, one switch each, to test with or without it. Each is compiled against
# either way, where anything is. Override one at the command line: ./gradlew :fabric:runClient -Penable_jei=false
#
# JEI (both loaders), for the info pages.
enable_jei=true
# Jade (NeoForge).
enable_jade=true
# Farmer's Delight Refabricated (Fabric; there's no NeoForge Farmer's Delight for 26.3), for the Silver Knife.
enable_farmers_delight=true
# Yori3o's Grappling Hooks (both loaders), for the Silver Grappling Hook, with the YACL it needs. YACL's 26.3 NeoForge
# build (3.9.7, GL24RgOP) says [26.2,26.3) in its neoforge.mods.toml, but under a quoted key FML never reads, so it loads.
enable_grappling_hooks=true

# Modrinth version ids of the mods above: Farmer's Delight Refabricated 26.3-3.6.30, Grappling Hooks 5.4.0 and
# YACL 3.9.7.
farmers_delight_fabric_version=dRScyUeE
grappling_hooks_fabric_version=kQy954ib
yacl_fabric_version=s9SjoFu1
grappling_hooks_neoforge_version=YZqaRrf1
yacl_neoforge_version=GL24RgOP
