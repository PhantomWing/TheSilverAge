## Mod info
mod_version=1.4.0
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_author=PhantomWing
mod_homepage=https://github.com/PhantomWing/TheSilverAge

org.gradle.jvmargs=-Xmx3G
# 26.1 needs the Gradle daemon itself on JDK 25 (not just the toolchain); system default is JDK 17.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is incompatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft
minecraft_version=26.2
minecraft_version_range=[26.2,26.2.1)
# Space-separated; drives the manifest range floor (first) + per-upload version tags (all).
supported_minecraft_versions=26.2
neo_version=26.2.0.88
neo_version_range=[26.2,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.5.169
architectury_loom_version=1.17.483
architectury_version=21.1.10
enabled_platforms=fabric,neoforge

# Publishing (mod-publish-plugin); IDs public, tokens from MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars.
mod_publish_plugin_version=2.0.0
modrinth_project_id=LEHsZZ4j
curseforge_project_id=1355287

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.160.0+26.2
# Create Fly, the Fabric port of Create (mod id `create`), from the Modrinth maven. 26.2-6.0.9-2 is a beta, the
# developer's pick.
create_fly_version=26.2-6.0.9-2

# Dev-runtime deps
jade_neoforge_version=26.2.10+neoforge
cloth_config_version=26.2.155
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install. 20.0.3 is the 26.2 build.
modmenu_version=20.0.3
# JEI: dev-runtime on both loaders, and its common API compiled against for the 1.4 info pages (compat/jei).
# Artifact id embeds ${minecraft_version}.
jei_version=30.48.0.244
# Yori3o's Grappling Hooks 5.4.0 and YACL 3.9.7, which it needs: Modrinth version ids, each loader's own.
grappling_hooks_neoforge_version=bq1Ld0kl
grappling_hooks_fabric_version=FVtKP7aL
yacl_neoforge_version=FfvwIZmI
yacl_fabric_version=DoR7RYgi

# Which optional mods the dev runs load, one switch each, to test with or without it. Override one at the command line:
#   ./gradlew :fabric:runClient -Penable_create_fly=false
#
# JEI, on both loaders, for the info pages.
enable_jei=true
# Jade (NeoForge).
enable_jade=true
# Create Fly (Fabric), for its machines on silver and the Silver Sheet.
enable_create_fly=true
# Yori3o's Grappling Hooks, on both loaders, for the Silver Grappling Hook.
enable_grappling_hooks=true

# The 1.4 info pages (compat/SilverInfo) show in JEI through the common compat/jei plugin. EMI, Enhanced Celestials,
# NeoForge's Create and Create: Aquatic Ambitions have no 26.2 build (checked 2026-11-01), so the Moon Dial's lunar
# events, Create on NeoForge and Aquatic Ambitions' channeling are left out of this line: compat/LunarEvents
# answers as for an ordinary night.
