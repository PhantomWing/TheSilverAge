# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21 (the previous
# NeoForge ModDev plugin only required a Java 21 *toolchain* and tolerated a JDK 17
# launcher). The system default `java` here is JDK 17, so the daemon JVM is pinned
# explicitly. Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: Architectury Loom is not yet compatible with the Gradle configuration cache,
# so it is disabled here (it was enabled under the previous NeoForge ModDev setup).
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.3
parchment_mappings_version=2024.12.07

# Minecraft — 1.21.3 (also covers 1.21.2; 1.21.3 is its hotfix, same API).
minecraft_version=1.21.3
minecraft_version_range=[1.21.2,1.21.4)
neo_version=21.3.58
neo_version_range=[21.3,)
loader_version_range=[4,)

# Architectury / multi-loader. architectury-loom 1.7.x + plugin 3.4.x support
# 1.21.2/1.21.3 (the Architectury API itself builds 14.0.x with loom 1.7-SNAPSHOT),
# so only the API version changes (13.0.8 → 14.0.4 for the 1.21.2/1.21.3 line).
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.435
architectury_version=14.0.4
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.114.1+1.21.3

## Mod info
mod_version=1.3.0
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_authors=PhantomWing

# Other dependencies (dev-runtime niceties — runtime only unless noted).
appleskin_neoforge_version=mc1.21.3-3.0.8
appleskin_fabric_version=mc1.21.3-3.0.6
jade_neoforge_version=16.0.4+neoforge
# Cloth Config (Fabric only, REAL dep) — backs the Fabric AutoConfig config.
# 16.0.143 is the Cloth Config build for the 1.21.2/1.21.3 line.
cloth_config_version=16.0.143

# --- 1.21.3 PORT NOTES ----------------------------------------------------------
# Create + Farmer's Delight (NeoForge) are NOT yet published past 1.21.1, so their
# compat is dropped on this branch:
#   * Create: compat code removed (re-add when Create ships for 1.21.3). silver_sheet
#     + the c:plates tags stay (vanilla), dormant until Create returns.
#   * Farmer's Delight (NeoForge): the Silver Knife now uses the SAME compile-only
#     KnifeItem stub as Fabric (no FD jar to compile against). Knife = SwordItem
#     fallback until FD ships for 1.21.3, then the real KnifeItem binds at runtime.
# FD Refabricated (Fabric) IS available (3.2.5) but we already compile against a stub,
# so no FDR jar/version is needed.
#
# JEI + EMI: temporarily disabled on this branch pending confirmed 1.21.3 versions
# (their mavens didn't surface a 1.21.3 build during the port). Re-add jei_version /
# emi_version + the recipe_viewer wiring once known.
