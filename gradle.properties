## Mod info
mod_version=1.3.1
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_author=PhantomWing
# Project home (homepage/sources/displayURL); the issues URL is derived as <this>/issues.
# Substituted into fabric.mod.json + neoforge.mods.toml at build time (see build.gradle manifestProps).
mod_homepage=https://github.com/PhantomWing/TheSilverAge

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21 (the previous
# NeoForge ModDev plugin only required a Java 21 *toolchain* and tolerated a JDK 17
# launcher). The system default `java` here is JDK 17, so the daemon JVM is pinned
# explicitly. Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: Architectury Loom is not yet compatible with the Gradle configuration cache,
# so it is disabled here (it was enabled under the previous NeoForge ModDev setup).
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

# Minecraft
# 1.21.9 ("The Copper Age") is a FEATURE update, but the copper/weathering system the mod
# builds on (WeatheringCopper* block classes, the WeatherState enum, oxidizables/waxables
# data maps) is UNCHANGED per the NeoForge primer. 1.21.9 and 1.21.10 are a compatible pair
# (1.21.10 is the stable follow-up). Built against the newer, STABLE 1.21.10 but SUPPORTS
# both: ranges span [1.21.9,1.21.11) and uploads tag BOTH (see supported_minecraft_versions).
minecraft_version=1.21.10
minecraft_version_range=[1.21.9,1.21.11)
# Single source for the supported game-version SET (space-separated). Drives both the
# manifest range floor (first entry) AND the per-upload minecraftVersions tags (every
# entry). minecraft_version above is the BUILD target = highest of these.
supported_minecraft_versions=1.21.9 1.21.10
# 1.21.9 stayed beta (last 21.9.16-beta); 1.21.10 has STABLE NeoForge — 21.10.64 is latest.
# Range floor 21.9 covers a 1.21.9 client on its beta NeoForge; the minecraft range caps it.
neo_version=21.10.64
neo_version_range=[21.9,)
loader_version_range=[4,)

# Architectury / multi-loader. architectury-loom 1.14.476 (latest) is used for the 1.21.10
# line. Architectury API jumped to 18.x for 1.21.9/1.21.10 (was 17.0.8 for 1.21.7/1.21.8).
# The architectury-plugin (3.4.x) is MC-agnostic and stays put.
architectury_plugin_version=3.4.164
architectury_loom_version=1.14.476
architectury_version=18.0.8
enabled_platforms=fabric,neoforge

# --- Publishing (Modrinth + CurseForge via mod-publish-plugin) ---------------------
# Project IDs are PUBLIC (safe to commit) — fill these in once from your project pages.
#   Modrinth:    project Settings → "Project ID" (or use the URL slug, e.g. "the-silver-age")
#   CurseForge:  the numeric Project ID shown on the project page sidebar.
# API TOKENS are SECRET — never put them here. Set as environment variables before
# publishing:  MODRINTH_TOKEN=...  CURSEFORGE_TOKEN=...
# Usage:  ./gradlew :fabric:publishMods        (publishes the Fabric jar to both sites)
#         ./gradlew :neoforge:publishMods      (publishes the NeoForge jar)
#         ./gradlew :fabric:publishMods -PpublishDryRun   (test — writes to build/, no upload)
mod_publish_plugin_version=2.0.0
modrinth_project_id=LEHsZZ4j
curseforge_project_id=1355287
# ----------------------------------------------------------------------------------

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.138.4+1.21.10



# Other dependencies (dev-runtime niceties — runtime only unless noted).
# Jade jumped to 20.x for the 1.21.9/1.21.10 line (was 19.3.1 on 1.21.7/1.21.8).
jade_neoforge_version=20.0.5+neoforge
# Cloth Config (Fabric only, REAL dep) — backs the Fabric AutoConfig config.
# 20.0.149 is the 1.21.9/1.21.10 build (was 19.0.147 on 1.21.7/1.21.8).
cloth_config_version=20.0.149

# --- 1.21.9 / 1.21.10 PORT NOTES ("The Copper Age") -----------------------------
# 1.21.9 is a FEATURE update but the copper/weathering system the mod extends is
# UNCHANGED per the NeoForge primer (docs.neoforged.net/primer/docs/1.21.9/). The big
# 1.21.9 churn is a rendering-pipeline / particle / debug-screen overhaul + submission-
# based block-entity rendering — none of which the mod's blocks use (no custom BE
# renderer). 1.21.10 is the stable follow-up; built against 1.21.10, supports 1.21.9+1.21.10.
#
# Create + Farmer's Delight (NeoForge) compat stays dropped (not published for this
# line yet):
#   * Create: compat code removed; silver_sheet + the c:plates tags stay (vanilla),
#     dormant until Create ships.
#   * Farmer's Delight (NeoForge): Silver Knife compiles against the local compile-only
#     KnifeItem stub (no FD jar). Knife = plain tool-component fallback until FD ships.
# FD Refabricated (Fabric) is consumed via the same stub, so no FDR jar is needed.
#
# AppleSkin: DROPPED — no build for this line. Re-add appleskin_*_version if one ships.
#
# RECIPE VIEWERS — both deferred:
#   * JEI: a 1.21.8 NeoForge build exists (24.2.0.6) but the viewer integration stays
#     dropped pending a Fabric counterpart / re-enable decision.
#   * EMI: STILL stalled at 1.21.1 — no 1.21.2+ build. The 1.21.1 EMI integration
#     (neoforge .../compat/emi/ModEmiPlugin) is preserved on the `version/1.21` branch
#     and drops back in once EMI ships. The `-Precipe_viewer=jei|emi|both|none` toggle
#     scaffolding is kept ready (defaults to none).
#   Re-add the viewer dep(s) + restore ModEmiPlugin when builds land.
#
# pack_format: see common/.../resourcepacks/silver_recipe_overrides/pack.mcmeta.
# --------------------------------------------------------------------------------
