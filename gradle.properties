## Mod info
mod_version=1.4.0
mod_id=thesilverage
mod_group_id=com.phantomwing.thesilverage
mod_license=MIT License
mod_name=The Silver Age
mod_description=A vanilla-friendly expansion that introduces (oxidizable) silver, designed and polished to feel like an official game drop.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21 (the previous
# NeoForge ModDev plugin only required a Java 21 *toolchain* and tolerated a JDK 17
# launcher). The system default `java` here is JDK 17, so the daemon JVM is pinned
# explicitly. Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NOTE: Architectury Loom is not yet compatible with the Gradle configuration cache,
# so it is disabled here (it was enabled under the previous NeoForge ModDev setup).
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.2)
# Bumped 21.1.218 → 21.1.219: Farmer's Delight 1.21.1-1.3.1 (optional Silver Knife
# compat) requires neoforge >= 21.1.219. Same MC 1.21.1 line; the mod still
# supports [21.1.218,) standalone (FD can't load on 218 anyway, so the knife
# falls back there). Matches RusticDelight's 1.21 branch.
neo_version=21.1.219
neo_version_range=[21.1.218,)
loader_version_range=[4,)

# Architectury / multi-loader
# Verified to resolve against https://maven.architectury.dev/ (see Phase 0 report).
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.435
architectury_version=13.0.8
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.116.12+1.21.1

# Other dependencies
appleskin_version=3.0.7
jei_version=19.21.2.313
emi_version=1.1.22+1.21.1
# Cloth Config (Fabric only) — backs the Fabric AutoConfig config (RD pattern).
# 15.0.140 is the Cloth Config build for the MC 1.21.1 line.
cloth_config_version=15.0.140
create_version=6.0.9-215
ponder_version=1.0.81
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
# Farmer's Delight (optional compat — the Silver Knife). NeoForge compiles + dev-runs
# against vectorwing FD from Modrinth Maven. Fabric (FD Refabricated) can't consume the
# FDR jar under architectury-loom 1.7.435, so it compiles against a compile-only stub of
# FDR's KnifeItem instead (fabric/src/fdrStub/) — no FDR jar/version needed there.
farmersdelight_neoforge_version=1.21.1-1.3.1

# Enhanced Celestials (optional Moon Dial compat). compileOnly only, never shipped.
# The common module compiles against the Fabric (intermediary-mapped) jar.
# DataAnchor is EC's own dependency; needed on the compile classpath because the
# lunar forecast class extends one of its types.
data_anchor_common_version=2.0.0.13-fabric
enhanced_celestials_common_version=6.0.2.5-fabric
enhanced_celestials_neoforge_version=6.0.2.5-neoforge
# EC's own required deps, needed at dev runtime alongside it.
corgilib_neoforge_version=1.21.1-5.0.0.9-NeoForge
corgilib_fabric_version=1.21.1-5.0.0.9-Fabric
data_anchor_neoforge_version=2.0.0.14-neoforge
data_anchor_fabric_version=2.0.0.14-fabric
enhanced_celestials_fabric_version=6.0.2.5-fabric
# Enhanced Celestials 2 — a separate mod with its own id (enhancedcelestials2core),
# not an update to the above, so both compat paths ship side by side. CurseForge
# only, hence curse.maven coordinates rather than a version string. The Core is a
# library with no events of its own; the lunar events themselves live in the
# separate "Default Lunar Events" mod, which is what dev runtime needs to test.
# The NeoForge Core jar is what `common` compiles against too — see the reason in
# common/build.gradle; there is deliberately no Fabric coordinate here.
enhanced_celestials_2_core_neoforge=curse.maven:ec2-core-1621796:8492180
enhanced_celestials_2_events_neoforge=curse.maven:ec2-events-1621820:8492326
# Which Enhanced Celestials is loaded at NeoForge dev runtime: 1, 2 or none. Both
# compat paths are ALWAYS compiled, this only picks what is there to test against.
# They can technically coexist, but loading one at a time is what actually exercises
# each branch of compat/LunarEvents.
#   ./gradlew :neoforge:runClient -Penhanced_celestials=2
enhanced_celestials=2
# The Lead Age (sibling mod), loaded at dev runtime for side-by-side comparison.
# CurseForge project 1544260; file ids are per loader and per release, so both
# need bumping when a new Lead Age version should be tested against.
# Currently The Lead Age 1.1.0 for 1.21.1.
the_lead_age_neoforge_file=8557090
the_lead_age_fabric_file=8557089
# Toggle whether Farmer's Delight is loaded at NeoForge dev runtime + datagen
# (modLocalRuntime + the `--existing-mod farmersdelight` datagen arg). FD is ALWAYS
# compiled against (modCompileOnly) regardless, so the Silver Knife KnifeItem
# subclass compiles either way. Set false to test the standalone / no-FD fallback.
#   ./gradlew :neoforge:runClient -PloadFD=false
loadFD=true

# Which recipe viewer(s) to load at runtime. Valid values: jei, emi, both, none
# Override at the command line with: ./gradlew runClient -Precipe_viewer=emi
recipe_viewer=jei

# Whether to load Create at runtime. Set to false to test without Create.
# Override at the command line with: ./gradlew runClient -Penable_create=false
enable_create=true
