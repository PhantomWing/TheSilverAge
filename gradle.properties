#     dormant until Create ships for 1.21.6+.
#   * Farmer's Delight (NeoForge): Silver Knife compiles against the local compile-only
#     KnifeItem stub (no FD jar). Knife = plain tool-component fallback until FD ships.
# FD Refabricated (Fabric) is consumed via the same stub, so no FDR jar is needed.
#
# AppleSkin: DROPPED — no 1.21.4/1.21.5/1.21.6 build. Re-add appleskin_*_version if one ships.
#
# RECIPE VIEWERS — NONE available for 1.21.6 (both deferred):
#   * JEI: no 1.21.6 build (its 21.5/1.21.5 build was 21.4.0.27; nothing for 1.21.6 yet).
#   * EMI: STALLED at 1.21.1 — latest EMI (1.1.24) still targets MC 1.21.1 only; no build
#     for 1.21.2+. The 1.21.1 EMI integration (neoforge .../compat/emi/ModEmiPlugin — adds
#     EMI world-interaction recipes for the silver oxidation/wax chain) is preserved on the
#     `version/1.21` branch and drops straight back in once EMI ships for 1.21.6. The
#     `-Precipe_viewer=jei|emi|both|none` toggle scaffolding is kept ready (defaults to none).
