plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.84'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = false
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run')
        }

        data {
            data()
            gameDirectory = project.file('run')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()

    // AppleSkin
    maven { url = 'https://maven.ryanliptak.com/' }

    // JEI
    maven {
        name = 'Jared\'s maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }

    // EMI
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }

    // Create and its dependencies (Ponder, Flywheel, Registrate)
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com/' }
}

// Recipe viewer selection — toggle at the command line with:
//   ./gradlew runClient -Precipe_viewer=jei
//   ./gradlew runClient -Precipe_viewer=emi
//   ./gradlew runClient -Precipe_viewer=both
//   ./gradlew runClient -Precipe_viewer=none
// Default is set in gradle.properties.
def selectedRecipeViewer = (project.findProperty('recipe_viewer') ?: 'jei').toString().toLowerCase()
if (!['jei', 'emi', 'both', 'none'].contains(selectedRecipeViewer)) {
    throw new GradleException("Invalid recipe_viewer='${selectedRecipeViewer}'. Valid values: jei, emi, both, none")
}
def loadJei = selectedRecipeViewer == 'jei' || selectedRecipeViewer == 'both'
def loadEmi = selectedRecipeViewer == 'emi' || selectedRecipeViewer == 'both'

// Create toggle — disable at the command line with:
//   ./gradlew runClient -Penable_create=false
// Default is set in gradle.properties.
def loadCreate = (project.findProperty('enable_create') ?: 'true').toString().toBoolean()

logger.lifecycle("[TheSilverAge] Recipe viewer: ${selectedRecipeViewer} (JEI=${loadJei}, EMI=${loadEmi}), Create: ${loadCreate}")

dependencies {
    // JEI (toggled by -Precipe_viewer=jei|both)
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if (loadJei) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }

    // EMI — compileOnly always (for future EmiPlugin if needed), runtime toggled
    modCompileOnly("dev.emi:emi-forge:${emi_version}")
    if (loadEmi) {
        modRuntimeOnly("dev.emi:emi-forge:${emi_version}")
    }

    // Appleskin
    modCompileOnly("squeek.appleskin:appleskin-forge:${appleskin_version}:api")
    modRuntimeOnly("squeek.appleskin:appleskin-forge:${appleskin_version}")

    // Create 6.0.x — compileOnly always (datagen uses Create's recipe gen API),
    // runtime toggled for in-game testing.
    modCompileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim") { transitive = false }
    modCompileOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modCompileOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")

    // JetBrains annotations (@NotNull etc.)
    compileOnly("org.jetbrains:annotations:24.0.0")
    if (loadCreate) {
        modRuntimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}-${create_version_number}:slim") { transitive = false }
        modRuntimeOnly("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
        modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
        modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
