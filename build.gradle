plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    // 26.1 is UNOBFUSCATED — architectury-loom's normal `dev.architectury.loom` still requires
    // a mappings dependency and a remapJar step, neither of which exists for 26.1 (see arch-loom
    // issue #328). The `-no-remap` plugin variant is the maintainer-blessed path: it drops the
    // mappings requirement + the remapJar task; common is bundled into each loader jar via the
    // Shadow plugin instead (shadowJar becomes the primary artifact). Same loom version (1.17.477).
    id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
    // Modrinth + CurseForge publishing — applied per loader subproject (fabric/neoforge).
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Extract the most recent version's notes from changelog.md (everything under the first
// "# X.Y.Z" header, up to the next "# " header) — used as the per-release changelog on
// Modrinth/CurseForge so each upload shows only its own changes. The changelog file is
// user-managed; this only READS it.
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }   // reached the next version → stop
            started = true                          // first version header → start
            return                                  // skip the header line itself
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

// Single source of truth for the manifest substitutions. Derives the dependency version
// ranges (in each loader's required FORMAT) from the canonical versions in gradle.properties,
// so fabric.mod.json + neoforge.mods.toml never hold a hardcoded range that can drift on a
// port. Expanded into both manifests by their processResources blocks.
//   Fabric  predicate format: ">=1.21.7 <1.21.9", ">=17.0"   (space = AND)
//   NeoForge maven range:     "[1.21.7,1.21.9)",  "[17.0,)"
ext.manifestProps = { ->
    def mc = rootProject.minecraft_version                          // build target = highest supported
    def p = mc.tokenize('.')
    def mcNext = "${p[0]}.${p[1]}.${(p[2] as int) + 1}".toString()   // 1.21.8 -> 1.21.9 (exclusive upper)
    // Lower bound = LOWEST supported game version. When the mod spans a compatible MC
    // pair (e.g. 1.21.7 + 1.21.8) the floor differs from the build target, so it is taken
    // from supported_minecraft_versions (space/comma-separated) rather than minecraft_version.
    def mcFloor = rootProject.supported_minecraft_versions.tokenize(' ,').first()
    // major.minor of a version, ignoring any +build / -qualifier suffix.
    def mm = { String v -> def q = v.replaceAll(/[+\-].*$/, '').tokenize('.'); "${q[0]}.${q[1]}".toString() }
    def fabricApiFloor = rootProject.fabric_api_version.replaceAll(/\+.*$/, '')   // 0.128.2+1.21.6 -> 0.128.2
    def homepage = rootProject.mod_homepage
    return [
            version                  : rootProject.mod_version,
            mod_id                   : rootProject.mod_id,
            mod_name                 : rootProject.mod_name,
            mod_description          : rootProject.mod_description,
            mod_author               : rootProject.mod_author,
            mod_license              : rootProject.mod_license,
            mod_homepage             : homepage,
            mod_issues               : "${homepage}/issues".toString(),
            // fabric.mod.json (predicate format)
            dep_minecraft_fabric     : ">=${mcFloor} <${mcNext}".toString(),
            dep_fabricloader         : ">=${rootProject.fabric_loader_version}".toString(),
            dep_fabric_api           : ">=${fabricApiFloor}".toString(),
            dep_architectury_fabric  : ">=${mm(rootProject.architectury_version)}".toString(),
            dep_cloth                : ">=${mm(rootProject.cloth_config_version)}".toString(),
            // neoforge.mods.toml (maven range format)
            dep_loader_neoforge      : rootProject.loader_version_range,
            dep_neoforge             : rootProject.neo_version_range,
            dep_minecraft_neoforge   : "[${mcFloor},${mcNext})".toString(),
            dep_architectury_neoforge: "[${mm(rootProject.architectury_version)},)".toString(),
    ]
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // 26.1 is UNOBFUSCATED: official Mojang names ARE the runtime names. Mojang no longer
        // ships a proguard mappings file (the 26.1.2 version JSON has no client_mappings /
        // server_mappings download), so there is NOTHING to map — the mappings block is dropped
        // entirely (loom.officialMojangMappings() would fail trying to download the missing file).
        // Parchment is likewise obsolete (no obfuscated param names left to improve).
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        // EMI
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }

        // Cloth Config — DEV-RUNTIME ONLY. AppleSkin Fabric JiJ-bundles
        // cloth-config-fabric (me.shedaniel.autoconfig.*); Loom/Architectury
        // does not auto-extract nested JiJ jars for a `modLocalRuntime` dep, so
        // the dev Fabric client needs Cloth Config on the classpath explicitly
        // (it is never compiled against and never shipped — see
        // fabric/build.gradle). Scoped to the Cloth Config group so this
        // canonical maven does not broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }

        // Modrinth Maven — Farmer's Delight (NeoForge optional compat).
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }

        // Create, Ponder, Flywheel
        maven { url = "https://maven.createmod.net" }

        // Registrate (transitive dep of Create)
        maven { url = "https://maven.ithundxr.dev/snapshots" }

        exclusiveContent {
            forRepository {
                maven {
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// The repository root is now a pure Architectury orchestration project. The legacy
// single-loader NeoForge sources still physically live under the root `src/` (they
// will be relocated to `common/` in Phase 1). Until then, point the root project's
// source sets at empty, non-existent directories so the root — which has no Minecraft
// dependencies — never attempts to compile that code. The files on disk are untouched.
project(':') {
    sourceSets {
        main {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
        test {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
    }
}
