plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    // loom-no-remap: 26.1 is unobfuscated, no mappings/remapJar; common is bundled via Shadow.
    id 'dev.architectury.loom-no-remap' version "${architectury_loom_version}" apply false
    // Publishing — applied per loader subproject.
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

// Single source of truth for manifest substitutions: derives per-loader dependency ranges from
// gradle.properties so the manifests never hold a drifting hardcoded range.
//   Fabric predicate: ">=1.21.7 <1.21.9"   NeoForge maven range: "[1.21.7,1.21.9)"
ext.manifestProps = { ->
    def mc = rootProject.minecraft_version
    def p = mc.tokenize('.')
    // Treat a missing patch segment as 0 so a 2-segment version (e.g. "26.2") still yields a patch bump ("26.2.1").
    def mcPatch = (p.size() > 2 ? p[2] as int : 0)
    def mcNext = "${p[0]}.${p[1]}.${mcPatch + 1}".toString()
    // Lower bound = lowest supported game version (may differ from build target across a compatible MC pair).
    def mcFloor = rootProject.supported_minecraft_versions.tokenize(' ,').first()
    // major.minor of a version, ignoring any +build / -qualifier suffix.
    def mm = { String v -> def q = v.replaceAll(/[+\-].*$/, '').tokenize('.'); "${q[0]}.${q[1]}".toString() }
    def fabricApiFloor = rootProject.fabric_api_version.replaceAll(/\+.*$/, '')
    def homepage = rootProject.mod_homepage
    return [
            version                  : rootProject.mod_version,
            mod_id                   : rootProject.mod_id,
            mod_name                 : rootProject.mod_name,
            mod_description          : rootProject.mod_description,
            mod_author               : rootProject.mod_author,
            mod_license              : rootProject.mod_license,
            mod_homepage             : homepage,
            mod_issues               : "${homepage}/issues".toString(),
            // fabric.mod.json (predicate format)
            dep_minecraft_fabric     : ">=${mcFloor} <${mcNext}".toString(),
            dep_fabricloader         : ">=${rootProject.fabric_loader_version}".toString(),
            dep_fabric_api           : ">=${fabricApiFloor}".toString(),
            dep_architectury_fabric  : ">=${mm(rootProject.architectury_version)}".toString(),
            dep_cloth                : ">=${mm(rootProject.cloth_config_version)}".toString(),
            // neoforge.mods.toml (maven range format)
            dep_loader_neoforge      : rootProject.loader_version_range,
            dep_neoforge             : rootProject.neo_version_range,
            dep_minecraft_neoforge   : "[${mcFloor},${mcNext})".toString(),
            dep_architectury_neoforge: "[${mm(rootProject.architectury_version)},)".toString(),
    ]
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // No mappings block: 26.1 is unobfuscated, Mojang ships no mappings file (officialMojangMappings would fail).
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        // EMI
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }

        // Cloth Config (scoped to its group so it doesn't broaden resolution).
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }

        // Modrinth Maven — Farmer's Delight (NeoForge optional compat).
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }

        // Create, Ponder, Flywheel
        maven { url = "https://maven.createmod.net" }

        // Registrate (transitive dep of Create)
        maven { url = "https://maven.ithundxr.dev/snapshots" }

        exclusiveContent {
            forRepository {
                maven {
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// Root is a pure orchestration project: empty its source sets so it never compiles the
// legacy single-loader sources still living under root `src/`.
project(':') {
    sourceSets {
        main {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
        test {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
    }
}
