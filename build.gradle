plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // Mojang official mappings, layered with Parchment (kept consistent with the
        // existing NeoForge ModDev setup which used Parchment ${parchment_mappings_version}).
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
        }
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        // EMI
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }

        // Cloth Config — DEV-RUNTIME ONLY. AppleSkin Fabric JiJ-bundles
        // cloth-config-fabric (me.shedaniel.autoconfig.*); Loom/Architectury
        // does not auto-extract nested JiJ jars for a `modLocalRuntime` dep, so
        // the dev Fabric client needs Cloth Config on the classpath explicitly
        // (it is never compiled against and never shipped — see
        // fabric/build.gradle). Scoped to the Cloth Config group so this
        // canonical maven does not broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }

        // Create, Ponder, Flywheel
        maven { url = "https://maven.createmod.net" }

        // Registrate (transitive dep of Create)
        maven { url = "https://maven.ithundxr.dev/snapshots" }

        exclusiveContent {
            forRepository {
                maven {
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// The repository root is now a pure Architectury orchestration project. The legacy
// single-loader NeoForge sources still physically live under the root `src/` (they
// will be relocated to `common/` in Phase 1). Until then, point the root project's
// source sets at empty, non-existent directories so the root — which has no Minecraft
// dependencies — never attempts to compile that code. The files on disk are untouched.
project(':') {
    sourceSets {
        main {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
        test {
            java { setSrcDirs([]) }
            resources { setSrcDirs([]) }
        }
    }
}
